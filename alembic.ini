# Developer entry point: `alembic revision --autogenerate -m "..."`, `alembic upgrade head`.
# The application itself runs migrations programmatically (superagent.db.session).
# sqlalchemy.url is intentionally empty: env.py falls back to SAX_DATABASE_URL / the default SQLite file.
[alembic]
script_location = src/superagent/db/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
